# Services: redis (queue), vllm (Qwen LLM on GPU), worker (Whisper on GPU), api (FastAPI)
# Only the api is published outside Docker. vLLM is internal-only.

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.8.5}
    <<: *gpu
    command: >
      --model ${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.55}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-16384}
      --host 0.0.0.0
      --port 8000
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    ipc: host
    expose:
      - "8000"
    volumes:
      - ./models/hf:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 900s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: app/Dockerfile
    <<: *gpu
    command: python3 worker/worker.py
    env_file: .env
    environment:
      - DATA_DIR=/data
      - STT_MODEL_DIR=/models/whisper
    volumes:
      - ./data:/data
      - ./models/whisper:/models/whisper
      - ./app/prompts:/app/app/prompts:ro
      - ./app/schemas:/app/app/schemas:ro
    depends_on:
      redis:
        condition: service_healthy
      vllm:
        condition: service_healthy   # start Whisper only after vLLM has taken its GPU share
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: app/Dockerfile   # same image as worker (layers are cached); no GPU needed
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    env_file: .env
    environment:
      - DATA_DIR=/data
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8080}:8080"
    volumes:
      - ./data:/data
      - ./app/prompts:/app/app/prompts:ro
      - ./app/schemas:/app/app/schemas:ro
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped
